[package]
name = "krty-desktop"
version = "0.3.4"
description = "Kretya Flow"
edition = "2021"

[lib]
name = "krty_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: child web views in the app window (Leads, src/leads.rs).
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
window-vibrancy = "0.6"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

# Windows: one copy at a time (a second launch, or a krty:// link, goes to
# the running one).
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
