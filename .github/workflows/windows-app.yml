# Builds Kretya Flow for Windows (the NSIS setup .exe) on a Windows runner.
# Nothing secret here: the updater signature is made afterwards on the
# release machine (scripts/release-windows.sh downloads this artifact,
# signs it with the local key and uploads it).
name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [build/windows]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-app.yml"

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install the Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Build the installer
        working-directory: desktop
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: kretya-flow-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
